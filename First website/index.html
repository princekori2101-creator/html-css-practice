<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Profile Card UI Design</title>
</head>

<body>
    <section>
        <div class="container profile-card">
            <div class="img">
                <img src="img.jpg.avif"
                    alt="profile" class="profile-img">
            </div>

            <div class="text-data">
                <h3>Coding with Radhika</h3>
                <p>YouTuber & Blogger</p>
            </div>

            <div class="icon">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-youtube"></i>
            </div>

            <div class="btn">
                <button>Subscribe</button>
                <button>Message</button>
            </div>

            <div class="bottom-icon">
                <i class="fa-regular fa-heart">60k</i>
                <i class="fa-regular fa-comment">20k</i>        
                <i class="fa-regular fa-share-from-square">12k</i>
            </div>
        </div>
    </section>
</body>

</html>
